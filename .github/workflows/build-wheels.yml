name: Build Multi-Platform Wheels

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build Linux x86_64 wheel
        run: |
          pip install maturin
          cd wren-core-py
          maturin build --release
      - uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: wren-core-py/target/wheels/

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build macOS ARM64 wheel
        run: |
          pip install maturin
          cd wren-core-py
          maturin build --release
      - uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: wren-core-py/target/wheels/

  build-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build Windows x86_64 wheel
        run: |
          pip install maturin
          cd wren-core-py
          maturin build --release
      - uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: wren-core-py/target/wheels/

